services:
  - type: web
    name: rag-app-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
    disk:
      name: chroma-storage
      mountPath: /data
      sizeGB: 1